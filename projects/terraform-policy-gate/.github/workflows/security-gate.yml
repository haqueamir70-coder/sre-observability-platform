name: Terraform Security Gate

on:
  push:
    paths:
      - "projects/terraform-policy-gate/**"
      - ".github/workflows/terraform-policy-gate.yml"
  pull_request:
    paths:
      - "projects/terraform-policy-gate/**"
      - ".github/workflows/terraform-policy-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-checks:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/terraform-policy-gate/infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate

  checkov:
    name: Infrastructure-as-code scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: python -m pip install --disable-pip-version-check checkov

      - name: Scan Terraform source
        run: checkov -d projects/terraform-policy-gate/infra --config-file projects/terraform-policy-gate/.checkov.yaml

  policy-tests:
    name: OPA policy tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Conftest
        uses: open-policy-agent/conftest-action@v0.1.0
        with:
          version: "0.56.0"

      - name: Verify secure configuration passes
        run: conftest test projects/terraform-policy-gate/policy-tests/secure-storage.json --policy projects/terraform-policy-gate/policy

      - name: Verify insecure configuration is rejected
        shell: bash
        run: |
          if conftest test projects/terraform-policy-gate/policy-tests/insecure-storage.json --policy projects/terraform-policy-gate/policy; then
            echo "ERROR: insecure fixture unexpectedly passed policy checks."
            exit 1
          else
            echo "PASS: policy rejected the insecure fixture as expected."
          fi

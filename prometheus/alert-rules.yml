groups:
  - name: sre-demo-alerts
    rules:
      - alert: DemoApiTargetDown
        expr: up{job="demo-api"} == 0
        for: 1m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "Demo API target is down"
          description: "Prometheus cannot scrape demo-api for more than one minute."
      - alert: DemoApiElevated5xxRate
        expr: |
          (sum(rate(http_requests_total{job="demo-api",status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_requests_total{job="demo-api"}[5m])), 0.001)) > 0.05
        for: 2m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "Elevated 5xx response rate"
          description: "More than 5% of observed requests are returning 5xx responses."
      - alert: DemoApiHighP95Latency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="demo-api"}[5m]))) > 0.3
        for: 5m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "Demo API p95 latency is high"
          description: "p95 request latency has exceeded 300 ms for five minutes."

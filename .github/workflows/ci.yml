name: SRE project CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON dashboard
        run: python -c "import json; json.load(open('grafana/dashboards/sre-service-overview.json', encoding='utf-8'))"

      - name: Validate Compose configuration
        run: docker compose config -q

      - name: Build API image
        run: docker build -t sre-demo-api:ci .
